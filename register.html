<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0b12"><title>สมัครสมาชิก – StreamDonate</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Kanit:wght@400;600&family=Sarabun:wght@400;600&family=Mitr:wght@400;500&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="top"><div class="wrap nav"><a class="logo" href="/"><i></i>StreamDonate</a><button class="burger" aria-label="เมนู">☰</button><nav class="links"><a href="/#features">ฟีเจอร์</a><a href="/#how">วิธีใช้</a><a href="/login.html" data-auth>เข้าสู่ระบบ</a><a class="btn sm" href="/register.html">สมัครฟรี</a></nav></div></header>
<main class="auth card"><h2>สมัครสมาชิก</h2><p class="mu">ยินดีต้อนรับสู่ StreamDonate</p><form id="authForm" data-mode="register" novalidate><label>ชื่อที่แสดง</label><input name="displayName" maxlength="40" autocomplete="nickname" required><label>ชื่อผู้ใช้ (a-z, 0-9, _)</label><input name="username" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username" required><label>รหัสผ่าน (อย่างน้อย 8 ตัว)</label><input name="password" type="password" minlength="8" autocomplete="new-password" required><div class="err" id="err" role="alert"></div><button class="btn block">สร้างบัญชี</button></form><p class="hint" style="text-align:center;margin-top:16px">มีบัญชีแล้ว? <a href="/login.html" class="grad">เข้าสู่ระบบ</a></p></main>
<script src="/js/main.js"></script><script src="/js/auth.js"></script></body></html>
