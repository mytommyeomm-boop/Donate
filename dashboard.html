<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0b12"><title>แดชบอร์ด – StreamDonate</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Kanit:wght@400;600&family=Sarabun:wght@400;600&family=Mitr:wght@400;500&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="top"><div class="wrap nav"><a class="logo" href="/"><i></i>StreamDonate</a><div class="links" style="position:static;display:flex;background:none;border:0;padding:0"><span class="mu" id="hi"></span><button class="btn sm ghost" id="logout">ออกจากระบบ</button></div></div></header>
<main class="wrap dash"><div class="tabs" id="tabs"><button data-t="over" class="on">ภาพรวม</button><button data-t="hist">ประวัติ</button><button data-t="cust">ปรับแต่ง</button></div>
<section id="over"><div class="grid g3"><div class="card stat"><b id="st-total">฿0</b><span>ยอดรวม (รายการจริง)</span></div><div class="card stat"><b id="st-today">฿0</b><span>วันนี้</span></div><div class="card stat"><b id="st-count">0</b><span>จำนวนครั้ง</span></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>ผู้สนับสนุนสูงสุด</h3><div id="top"></div></div><div class="card"><h3>ล่าสุด</h3><div id="recent"></div></div></div>
<div class="card" style="margin-top:16px"><h3>ลิงก์ของคุณ</h3><label>หน้าโดเนท (ส่งให้ผู้ชม)</label><div class="copy"><input id="u-page" readonly><button class="btn sm ghost" data-copy="u-page">คัดลอก</button></div><label>OBS Overlay (Browser Source — เก็บเป็นความลับ)</label><div class="copy"><input id="u-ov" readonly><button class="btn sm ghost" data-copy="u-ov">คัดลอก</button></div><p class="hint" style="margin-top:8px">OBS: เพิ่ม Browser Source → วางลิงก์ → ขนาด 1920×1080 → ไม่ต้องใส่ CSS เพิ่ม</p></div></section>
<section id="hist" class="hide"><div class="card"><h3>ประวัติการโดเนท</h3><p class="hint">รายการที่มีป้าย "ทดสอบ" ไม่นับรวมในยอดจริง</p><div id="all"></div></div></section>
<section id="cust" class="hide"><form id="cf" class="grid g2" novalidate><div class="card"><h3>การแจ้งเตือน</h3>
<div class="grid g2"><div><label>สีหลัก</label><input type="color" name="color"></div><div><label>สีรอง</label><input type="color" name="color2"></div></div>
<label>ฟอนต์</label><select name="font"><option>Prompt</option><option>Kanit</option><option>Sarabun</option><option>Mitr</option><option>Noto Sans Thai</option></select>
<label>แอนิเมชัน</label><select name="anim"><option value="slide">สไลด์</option><option value="pop">ป๊อป</option><option value="bounce">เด้ง</option><option value="fade">ค่อยๆ ปรากฏ</option></select>
<label>เสียง</label><select name="sound"><option value="chime">ระฆัง</option><option value="coin">เหรียญ</option><option value="pop">ป๊อป</option><option value="none">ปิดเสียง</option></select>
<label>ระดับเสียง</label><input type="range" name="volume" min="0" max="1" step=".05"><label>ระยะเวลาแสดง (<span id="dv"></span> วินาที)</label><input type="range" name="duration" min="3" max="20" step="1">
<label>ตัวอย่าง</label><div class="pv" id="pv"></div><div class="grid g2" style="margin-top:10px"><button type="button" class="btn ghost" id="prev">ดูตัวอย่าง</button><button type="button" class="btn ghost" id="obs">ส่งทดสอบไป OBS</button></div></div>
<div class="card"><h3>หน้าโดเนท</h3><label>ชื่อที่แสดง</label><input name="displayName" maxlength="40"><label>ข้อความแนะนำตัว</label><textarea name="bio" maxlength="160"></textarea><label>สีธีมของหน้าโดเนท</label><input type="color" name="accent"><label>ยอดแนะนำ (คั่นด้วยเครื่องหมายจุลภาค)</label><input name="suggested" placeholder="20,50,100,300"><label>ยอดขั้นต่ำ (บาท)</label><input name="minAmount" type="number" min="1" max="10000" inputmode="numeric">
<div class="err" id="cerr" role="alert"></div><button class="btn block" id="save">บันทึกการตั้งค่า</button></div></form></section></main>
<script src="/js/main.js"></script><script src="/js/dashboard.js"></script></body></html>
